# offline 테스트 전용 설정. 운영에서는 이 프로필을 활성화하지 않는다.
chat:
  backend:
    base-url: ${BACKEND_BASE_URL:http://127.0.0.1:8000}
  channels:
    allowed:
      "00000000-0000-0000-0000-000000000001": PFC
      "00000002-0000-0000-0000-000000000002": PFC
  staging:
    channels:
      "00000002-0000-0000-0000-000000000002": ${STAGING_BACKEND_URL:http://localhost:8002}
  offline:
    allowed-customers:
      "00000002-0000-0000-0000-000000000002": [P000000001]

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

# 외부망에서는 Eureka 대신 SimpleDiscoveryClient가 mock 서버를 찾는다.
spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            search-autocomplete-service:
              - uri: ${AUTOCOMPLETE_BASE_URL:http://localhost:8001}
