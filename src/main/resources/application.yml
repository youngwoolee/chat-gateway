spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  application:
    name: chat-gateway
  cloud:
    loadbalancer:
      retry:
        enabled: false
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false
server:
  compression:
    enabled: false
  # 외부가 보낸 Forwarded 헤더를 기본 신뢰하지 않는다. 운영 프록시의 신뢰 경계는 별도 설정한다.
  forward-headers-strategy: none
  shutdown: graceful
  tomcat:
    connection-timeout: 30s
    max-connections: 2000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}
chat:
  mfa:
    max-header-bytes: 4096
  session-service:
    service-id: agent-session-service
    credential: ${SESSION_SERVICE_CREDENTIAL:}
    connect-timeout: 2s
    response-timeout: 3s
  # Agent B/E 연결. SSE heartbeat 간격은 response-timeout보다 짧아야 한다.
  backend:
    connect-timeout-millis: 3000
    response-timeout: 30s
    max-streams: 100
    base-url: ${BACKEND_BASE_URL}
  session:
    # 발화·도구 실행 등 인정 활동으로 연장하는 세션 유효시간
    idle-timeout: 5m
    # 플랫폼 _O 삭제 / _I 발급에 공통 사용. 세션 쿠키에는 Domain을 설정하지 않는다.
    platform-domain: shinhancard.com
    platform-path: /
  # staging 고객 권한. 실제 채널과 목적지는 서버 설정으로 등록한다.
  staging:
    channels: {}
    cache-ttl: 1m
    cache-size: 10000
    database: chat_gateway
    # mongo-uri는 운영 외부 설정에서 주입한다. 미설정 시 staging 회원 권한 조회는 503.
  channels:
    # 임시 내부망 연동 테스트용. 검증을 복구하려면 CHANNEL_ALLOWLIST_ENABLED=true.
    allowlist-enabled: ${CHANNEL_ALLOWLIST_ENABLED:false}
    # 채널 UUID → PFC. 첫 구간은 쿠키 접두사이므로 채널마다 달라야 한다. 빈 목록은 모두 거절한다.
    allowed: {}
