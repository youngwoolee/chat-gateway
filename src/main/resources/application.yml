spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  application:
    name: chat-gateway
  cloud:
    loadbalancer:
      retry:
        enabled: false
    gateway:
      server:
        webmvc:
          # 도구 실행 본문은 form을 포함해 원문 그대로 중계한다.
          form-filter:
            enabled: false
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false
server:
  compression:
    enabled: false
  # 외부가 보낸 Forwarded 헤더를 기본 신뢰하지 않는다. 운영 프록시의 신뢰 경계는 별도 설정한다.
  forward-headers-strategy: none
  shutdown: graceful
  tomcat:
    connection-timeout: 30s
    max-connections: 2000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
chat:
  # FE 피드백 반영 제안값. 실제 PFC 수단·위자드 체류시간 합의 후 조정한다.
  mfa:
    registration-ttl: 10m
    verified-ttl: 2m
    max-results: 8
    max-header-bytes: 4096
    methods: [FINANCE_CA, SHINHAN]
  session-service:
    service-id: agent-session-service
    credential: ${SESSION_SERVICE_CREDENTIAL:}
    connect-timeout: 2s
    response-timeout: 3s
  # Agent B/E 연결. SSE heartbeat 간격은 response-timeout보다 짧아야 한다.
  backend:
    connect-timeout-millis: 3000
    response-timeout: 30s
    max-streams: 100
    base-url: ${BACKEND_BASE_URL:http://127.0.0.1:8000}
  session:
    # 발화·도구 실행 등 인정 활동으로 연장하는 세션 유효시간
    idle-timeout: 5m
    # 이미 시작한 실행의 별도 기한. 세션 자연 만료가 진행 중인 답변을 끊지는 않는다.
    execution-timeout: 10m
    # 플랫폼 _O 삭제 / _I 발급에 공통 사용. 세션 쿠키에는 Domain을 설정하지 않는다.
    platform-domain: shinhancard.com
    platform-path: /
    # Gateway → B/E 서비스 인증. 실제 값은 환경변수 등 외부 설정으로 주입한다.
    backend-credential: ${BACKEND_SERVICE_CREDENTIAL:}
    # B/E → Gateway 서비스 인증. 브라우저에 노출하거나 사용자 인증으로 사용하지 않는다.
    inbound-credential: ${GATEWAY_SERVICE_CREDENTIAL:}
    # 추가 인증 등록이 허용된 업무 인터페이스만 등록한다. 빈 목록은 모두 차단한다.
    allowed-interfaces: []
  # staging 고객 권한. 실제 채널과 목적지는 서버 설정으로 등록한다.
  staging:
    channels: {}
    cache-ttl: 1m
    cache-size: 10000
    database: chat_gateway
    # mongo-uri는 운영 외부 설정에서 주입한다. 미설정 시 staging 회원 권한 조회는 503.
  channels:
    # 채널 UUID → PFC. 기본 빈 목록은 모든 채널 요청을 거절한다.
    allowed: {}
