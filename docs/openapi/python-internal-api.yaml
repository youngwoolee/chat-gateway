openapi: 3.0.3
info:
  title: Agent B/E 연동 API
  version: 1.2.0
  description: G/W → B/E contract. Customer/channel headers establish identity; B/E owns thread and interrupt state.
    See ../backend-integration-spec.md.
servers:
- url: http://localhost:8000
  description: Agent B/E. Destination is selected by the authenticated session channel.
security: []
paths:
  /api/chat:
    parameters:
    - $ref: '#/components/parameters/X-Authenticated-User-Id'
    - $ref: '#/components/parameters/X-Authenticated-Channel-Id'
    - $ref: '#/components/parameters/X-Verified-Request-Id'
    post:
      summary: 대화·interrupt 재개
      description: B/E checks thread ownership and conversation expiry. Unknown threadId creates a new conversation.
        Authentication-required resolved interrupts require a matching X-Verified-Request-Id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAgentInput'
            example:
              threadId: thread-001
              runId: '1'
              messages:
              - id: user-001
                role: user
                content: 카드 분실신고 해줘
              tools: []
              context: []
              forwardedProps: null
      responses:
        '200':
          description: ag-ui data-only SSE; JSON type identifies the event.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
        '400':
          description: INTERRUPT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: THREAD_EXPIRED or THREAD_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/chat/threads:
    parameters:
    - $ref: '#/components/parameters/X-Authenticated-User-Id'
    - $ref: '#/components/parameters/X-Authenticated-Channel-Id'
    - $ref: '#/components/parameters/X-Verified-Request-Id'
    get:
      summary: 대화 목록
      description: Member-only; sorted by last_active_at descending. Does not require a selected thread.
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - thread_id
                  - title
                  - last_active_at
                  properties:
                    thread_id:
                      type: string
                    title:
                      type: string
                    last_active_at:
                      type: string
                      pattern: ^[0-9]{14}$
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: GUEST_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/chat/threads/{tid}/messages:
    parameters:
    - $ref: '#/components/parameters/X-Authenticated-User-Id'
    - $ref: '#/components/parameters/X-Authenticated-Channel-Id'
    - $ref: '#/components/parameters/X-Verified-Request-Id'
    - $ref: '#/components/parameters/Thread'
    get:
      summary: 메시지 이력
      description: B/E checks ownership; expired conversation history remains readable.
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                required:
                - messages
                properties:
                  messages:
                    type: array
                    items: &id001
                      type: object
                      required:
                      - id
                      properties:
                        id:
                          type: string
                        role:
                          type: string
                        content: {}
                      additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: THREAD_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: THREAD_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/chat/threads/{tid}/tools/{tool-name}/{tool-route}:
    parameters:
    - $ref: '#/components/parameters/X-Authenticated-User-Id'
    - $ref: '#/components/parameters/X-Authenticated-Channel-Id'
    - $ref: '#/components/parameters/X-Verified-Request-Id'
    - $ref: '#/components/parameters/Thread'
    - $ref: '#/components/parameters/ToolName'
    - $ref: '#/components/parameters/ToolRoute'
    post:
      summary: 위자드 데이터 조회
      description: B/E validates tool route, ownership, existence and conversation expiry. Body and response follow
        the route schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: THREAD_FORBIDDEN or THREAD_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: TOOL_NOT_FOUND or THREAD_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    X-Authenticated-User-Id:
      name: X-Authenticated-User-Id
      in: header
      required: true
      description: 'G/W-verified customer ID. Guest: G + 12 characters; member: P + 9 characters.'
      schema:
        type: string
    X-Authenticated-Channel-Id:
      name: X-Authenticated-Channel-Id
      in: header
      required: true
      description: G/W-verified session channel.
      schema:
        type: string
        format: uuid
    X-Verified-Request-Id:
      name: X-Verified-Request-Id
      in: header
      required: false
      description: 'Only on PFC authentication success: the single resume interruptId. B/E matches it to its pending
        authentication interrupt.'
      schema:
        type: string
        minLength: 1
    Thread:
      name: tid
      in: path
      required: true
      schema:
        type: string
    ToolName:
      name: tool-name
      in: path
      required: true
      schema:
        type: string
    ToolRoute:
      name: tool-route
      in: path
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - status
          - message
          properties:
            code:
              type: integer
            status:
              type: string
            message:
              type: string
              enum:
              - ''
    RunAgentInput:
      type: object
      required:
      - threadId
      - runId
      - messages
      - tools
      - context
      - forwardedProps
      properties:
        threadId:
          type: string
          minLength: 1
          description: FE-selected or newly generated conversation ID. B/E checks ownership; not stored in the login
            session.
        runId:
          type: string
          pattern: ^[0-9]+$
          description: B/E sets the canonical turn number in RUN_STARTED.
        messages:
          type: array
          items: *id001
        tools:
          type: array
          items: {}
          default: []
        context:
          type: array
          items: {}
          default: []
        forwardedProps:
          nullable: true
          default: null
        state: {}
        parentRunId:
          type: string
        resume:
          type: array
          items:
            $ref: '#/components/schemas/Resume'
      additionalProperties: true
    Resume:
      type: object
      required:
      - interruptId
      - status
      properties:
        interruptId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - resolved
          - cancelled
        payload: {}
        metadata: {}
      additionalProperties: true
  responses:
    Error:
      description: 'HTTP status equals error.code; message is empty. Common: 404 NOT_FOUND, 405 METHOD_NOT_ALLOWED,
        422 VALIDATION_ERROR, 500 INTERNAL_ERROR.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
