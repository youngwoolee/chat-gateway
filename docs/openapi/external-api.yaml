openapi: 3.0.3
info:
  title: Chat Gateway Session API
  version: 1.2.0
  description: 'Start prepares a channel-specific MEMBER or GUEST session. FE loads conversation list and history
    only for MEMBER; GUEST starts a new conversation. Submitted _O credentials are validated for a new session:
    success creates MEMBER, while incomplete or rejected credentials and PFC login failures create GUEST. Without
    _O, reuse a valid channel session; create GUEST only when the selected channel cookie is absent. Expired, invalid
    or revoked sessions presented for reuse return 401. On expiry, G/W deletes only the selected channel cookie;
    FE then calls start and branches on userType. Member recovery requires fresh _O credentials. Session-service
    failures return 503. threadId belongs to B/E and is not stored in the login session. All FE-facing API responses
    include X-Server-Time. A verified valid session also supplies X-Chat-User-Type and X-Chat-Auth-Expires-At, including
    JSON, SSE and B/E error responses. These are G/W-to-FE response headers. GET and autocomplete do not extend
    the session; SSE supplies headers once at stream start. See ../agent-api-gw-session-summary.md.'
security:
- sessionCookie: []
paths:
  /api/auth/session:
    parameters:
    - $ref: '#/components/parameters/Channel'
    post:
      summary: 'start: _O 인증·채널별 세션 생성 또는 재사용'
      security: []
      parameters:
      - name: PlatformSystemCode_O
        in: cookie
        required: false
        schema:
          type: string
        description: Platform _O login credential. Incomplete or invalid credentials create a guest session.
      - name: PlatformAuthentication_O
        in: cookie
        required: false
        schema:
          type: string
        description: Platform _O login credential. Incomplete or invalid credentials create a guest session.
      - name: PlatformVerify_O
        in: cookie
        required: false
        schema:
          type: string
        description: Platform _O login credential. Incomplete or invalid credentials create a guest session.
      responses:
        '200':
          description: Member or guest session ready. Returns the channel-specific session cookie and all three
            common response headers. The body uses userType MEMBER or GUEST and UTC epoch milliseconds; member response
            also issues homepage _I cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                member:
                  value:
                    userType: MEMBER
                    expiresAt: 1792638300000
                    serverTime: 1792638000000
                guest:
                  value:
                    userType: GUEST
                    expiresAt: 1792638300000
                    serverTime: 1792638000000
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        default:
          $ref: '#/components/responses/Error'
        '503':
          description: 'UNAVAILABLE: session service cannot create, look up or update a session. PFC login failures
            use guest fallback.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        '401':
          description: 'UNAUTHENTICATED: existing session presented for reuse without _O is expired, invalid or
            revoked. Expiry deletes the selected channel cookie so FE can prepare a new session. _O verification
            failure creates GUEST.'
          headers:
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
            Set-Cookie:
              description: Present on session expiry to delete the selected channel cookie. Other channel cookies
                are preserved.
              schema:
                type: string
              example: __Host-sh-session_11111111=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: 401
                  status: UNAUTHENTICATED
                  message: ''
      description: 'No request body. With submitted platform _O cookies, perform login verification to create a
        new session: successful PFC verification creates MEMBER and deletes used _O cookies. Incomplete, malformed
        or rejected credentials and PFC errors, timeouts or abnormal responses create GUEST through agent-session-service
        and return 200. Without _O, reuse and extend a valid channel session; create GUEST only when the selected
        channel cookie is absent. An expired, invalid or revoked SID presented for reuse returns 401 UNAUTHENTICATED.
        On expiry, delete only the expired channel cookie. FE can then call start again: MEMBER loads conversation
        list and history, GUEST starts a new conversation. Member recovery requires fresh _O credentials. Session-service
        creation, lookup or update failure returns 503 UNAVAILABLE. Guest access to restricted channels returns
        403. userType is the string MEMBER or GUEST. Session requests, responses and storage contain no threadId.'
  /api/chat/auto:
    parameters:
    - $ref: '#/components/parameters/Channel'
    post:
      summary: 자동완성 조회 (기존 챗봇 요청·응답 호환)
      description: Valid guest/member channel session required. No session extension. Search data and highlighting
        follow the search service contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - queryText
              properties:
                queryText:
                  type: string
                  minLength: 1
                size:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 10
                channel:
                  type: string
                  minLength: 1
                  default: sol-chat
      responses:
        '200':
          description: Legacy success envelope; search data fields preserved
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: string
                    enum:
                    - SUCCESS
                  message:
                    type: string
                    example: 성공
                  data:
                    type: object
                    required:
                    - totalCount
                    - chatResponse
                    properties:
                      totalCount:
                        type: integer
                        minimum: 0
                      chatResponse:
                        type: array
                        items:
                          type: object
                          properties:
                            highlight:
                              type: string
                            score:
                              type: number
                            auto_result:
                              type: string
                            weight:
                              type: integer
                            boost:
                              type: string
                            nori_result:
                              type: string
                            ngram_result:
                              type: string
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        default:
          $ref: '#/components/responses/Error'
  /api/chat:
    parameters:
    - $ref: '#/components/parameters/Channel'
    post:
      summary: 채팅·SSE 및 추가 인증 resume 중계
      description: G/W checks the channel login session and relays ag-ui input. X-Mfa-Result, when present, is one
        unpadded base64url UTF-8 AuthRequest JSON object with identifier, ticketIds and code. Validate one resolved
        resume item with PFC before forwarding. G/W does not store threadId; B/E checks ownership. Business MFA
        rejection returns 403 MFA_INVALID; PFC errors, timeouts or abnormal responses return 503 UNAVAILABLE. No
        guest fallback applies to business MFA and B/E is not called on MFA failure. B/E handles duplicate business
        requests using its execution and interrupt state.
      parameters:
      - name: X-Mfa-Result
        in: header
        required: false
        schema:
          type: string
          maxLength: 4096
      - name: __state_as_id
        in: cookie
        required: false
        schema:
          type: string
        description: Required with X-Mfa-Result for the PFC authentication state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAgentInput'
            example:
              threadId: thread-001
              runId: '1'
              messages:
              - id: user-001
                role: user
                content: 카드 분실신고 해줘
              tools: []
              context: []
              forwardedProps: null
      responses:
        '200':
          description: B/E ag-ui data-only SSE. FE uses JSON type to interpret events.
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        default:
          $ref: '#/components/responses/Error'
  /api/chat/threads:
    parameters:
    - $ref: '#/components/parameters/Channel'
    get:
      summary: 대화 목록 조회
      responses:
        '200':
          description: B/E response unchanged
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        default:
          $ref: '#/components/responses/Error'
  /api/chat/threads/{tid}/messages:
    parameters:
    - $ref: '#/components/parameters/Channel'
    - $ref: '#/components/parameters/Thread'
    get:
      summary: 대화 메시지 조회
      responses:
        '200':
          description: B/E response unchanged
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        default:
          $ref: '#/components/responses/Error'
  /api/click:
    parameters:
    - $ref: '#/components/parameters/Channel'
    post:
      summary: Gateway 클릭 로그 기록 및 세션 연장
      description: Gateway logs validated fields as JSON without calling B/E. Additional fields are ignored. Each
        valid click extends the session. Logs may repeat; 200 does not guarantee durable log ingestion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - threadId
              - scenarioId
              - state
              - component
              properties:
                threadId:
                  type: string
                  description: FE-selected conversation ID recorded in the click log; not compared with login-session
                    state.
                scenarioId:
                  type: string
                  minLength: 1
                state:
                  type: string
                  minLength: 1
                component:
                  oneOf:
                  - type: string
                    minLength: 1
                  - type: object
                    additionalProperties: true
                buttonInfo:
                  type: object
                  nullable: true
                  description: 기존 로그 수집기용 선택 버튼 정보. 정의된 문자열 필드만 기록하며 고객 입력·민감정보를 보내지 않는다.
                  properties:
                    buttonType:
                      type: string
                      nullable: true
                    buttonNm:
                      type: string
                      nullable: true
                    buttonUrl:
                      type: string
                      nullable: true
                    buttonUtterance:
                      type: string
                      nullable: true
                    phoneNumber:
                      type: string
                      nullable: true
                  additionalProperties: true
              additionalProperties: true
      responses:
        '200':
          description: Gateway log emitted; expiration headers set
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - OK
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        default:
          $ref: '#/components/responses/Error'
  /api/chat/threads/{tid}/tools/{tool-name}/{tool-route}:
    parameters:
    - $ref: '#/components/parameters/Channel'
    - name: tid
      in: path
      required: true
      schema:
        type: string
    - name: tool-name
      in: path
      required: true
      schema:
        type: string
    - name: tool-route
      in: path
      required: true
      schema:
        type: string
    post:
      summary: 위자드 데이터 조회
      description: B/E validates tool route, ownership, existence and conversation expiry. Body and response follow
        the route schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: THREAD_FORBIDDEN or THREAD_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
        '404':
          description: TOOL_NOT_FOUND or THREAD_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Chat-User-Type:
              $ref: '#/components/headers/ChatUserType'
            X-Chat-Auth-Expires-At:
              $ref: '#/components/headers/ChatAuthExpiresAt'
            X-Server-Time:
              $ref: '#/components/headers/ServerTime'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sh-session_00000000
      description: Channel cookie name is __Host-sh-session_<first UUID segment>. This name is an example; select
        by required channelId query.
  parameters:
    Channel:
      name: channelId
      in: query
      required: true
      description: Full allowed channel ID, required on every session request. Selects the channel-specific cookie.
        Cookie prefixes must be unique across allowed channels.
      schema:
        type: string
        format: uuid
    Thread:
      name: tid
      in: path
      required: true
      schema:
        type: string
  schemas:
    Session:
      type: object
      required:
      - userType
      - expiresAt
      - serverTime
      properties:
        userType:
          type: string
          enum:
          - MEMBER
          - GUEST
          description: Session type as the string MEMBER or GUEST.
        expiresAt:
          type: integer
          format: int64
          description: UTC epoch milliseconds
        serverTime:
          type: integer
          format: int64
          description: UTC epoch milliseconds
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - status
          - message
          properties:
            code:
              type: integer
            status:
              type: string
            message:
              type: string
              enum:
              - ''
      description: 'HTTP status equals error.code. G/W: 400 INVALID_ARGUMENT, 401 UNAUTHENTICATED, 403 PERMISSION_DENIED
        or MFA_INVALID, 503 UNAVAILABLE, 500 INTERNAL_ERROR. B/E HTTP errors pass through.'
    RunAgentInput:
      type: object
      required:
      - threadId
      - runId
      - messages
      - tools
      - context
      - forwardedProps
      properties:
        threadId:
          type: string
          minLength: 1
          description: FE-selected or newly generated conversation ID. B/E checks ownership; not stored in the login
            session.
        runId:
          type: string
          pattern: ^[0-9]+$
          description: B/E sets the canonical turn number in RUN_STARTED.
        messages:
          type: array
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
              role:
                type: string
              content: {}
            additionalProperties: true
        tools:
          type: array
          items: {}
          default: []
        context:
          type: array
          items: {}
          default: []
        forwardedProps:
          nullable: true
          default: null
        state: {}
        parentRunId:
          type: string
        resume:
          type: array
          items:
            $ref: '#/components/schemas/Resume'
      additionalProperties: true
    Resume:
      type: object
      required:
      - interruptId
      - status
      properties:
        interruptId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - resolved
          - cancelled
        payload: {}
        metadata: {}
      additionalProperties: true
  responses:
    Error:
      description: HTTP matches error.code; message is always empty
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Chat-User-Type:
          $ref: '#/components/headers/ChatUserType'
        X-Chat-Auth-Expires-At:
          $ref: '#/components/headers/ChatAuthExpiresAt'
        X-Server-Time:
          $ref: '#/components/headers/ServerTime'
  headers:
    ChatUserType:
      description: G/W session type, present only when a valid session is verified. Applies to successes and errors.
      required: false
      schema:
        type: string
        enum:
        - MEMBER
        - GUEST
      example: GUEST
    ChatAuthExpiresAt:
      description: Current G/W session expiry in UTC epoch milliseconds, present only when a valid session is verified.
        GET and autocomplete do not extend it; SSE sends it once before streaming.
      required: false
      schema:
        type: integer
        format: int64
      example: 1792638300000
    ServerTime:
      description: G/W server time in UTC epoch milliseconds. Returned even when no valid session can be verified.
      required: true
      schema:
        type: integer
        format: int64
      example: 1792638000000
